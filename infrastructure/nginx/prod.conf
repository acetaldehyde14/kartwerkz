# Production reverse proxy.
#
# IMPORTANT: this file assumes TLS certificates already exist at
# /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem (see
# docs/deployment.md for Certbot/Let's Encrypt provisioning). Until then,
# the HTTPS server block below will fail to start — keep the HTTP-only
# block active and add HTTPS once certs are issued.

client_max_body_size 50m;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream storefront_upstream {
    server storefront:3000;
}

upstream api_upstream {
    server api:4000;
}

# Plain HTTP: redirect everything to HTTPS once certs exist. Until then this
# serves traffic directly so the stack remains reachable during initial setup.
server {
    listen 80;
    server_name ${PUBLIC_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://storefront_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
